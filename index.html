<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Rastreador de Coordenadas</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border-color: #334155;
      --success: #22c55e;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      background: rgba(37, 99, 235, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .icon-wrapper svg {
      width: 32px;
      height: 32px;
      fill: var(--primary);
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .status-box.info {
      display: block;
      background: rgba(37, 99, 235, 0.1);
      color: #60a5fa;
      border: 1px solid rgba(37, 99, 235, 0.2);
    }

    .status-box.success {
      display: block;
      background: rgba(34, 197, 94, 0.1);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.2);
    }

    .status-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      color: var(--error);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/>
      </svg>
    </div>

    <h2>Verificação de Localização</h2>
    <p>Clique no botão para autorizar a recolha do sinal GPS e registar os dados na folha de cálculo.</p>

    <button id="btnEnviar" onclick="iniciarEnvio()">
      <span class="spinner" id="spinner"></span>
      <span id="btnText">Enviar Coordenadas</span>
    </button>

    <div id="statusBox" class="status-box"></div>
  </div>

  <script>
    // Substitua pelo URL da sua implementação do Web App (/exec)
    const WEB_APP_URL = "URL_DO_SEU_WEB_APP_AQUI";

    const btn = document.getElementById("btnEnviar");
    const btnText = document.getElementById("btnText");
    const spinner = document.getElementById("spinner");
    const statusBox = document.getElementById("statusBox");

    function definirStatus(mensagem, tipo) {
      statusBox.className = `status-box ${tipo}`;
      statusBox.textContent = mensagem;
    }

    function alterarEstadoBotao(carregando, texto) {
      btn.disabled = carregando;
      btnText.textContent = texto;
      spinner.style.display = carregando ? "inline-block" : "none";
    }

    function iniciarEnvio() {
      if (!("geolocation" in navigator)) {
        definirStatus("O seu navegador não suporta geolocalização.", "error");
        return;
      }

      alterarEstadoBotao(true, "A obter GPS...");
      definirStatus("A aguardar autorização e leitura das coordenadas...", "info");

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;

          alterarEstadoBotao(true, "A gravar...");
          definirStatus("Sinal capturado! A sincronizar com o Google Sheets...", "info");

          const url = `${WEB_APP_URL}?add=true&latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&linkmapa=${encodeURIComponent(mapsLink)}`;

          fetch(url)
            .then(res => res.json())
            .then(data => {
              alterarEstadoBotao(false, "Enviar Novamente");
              if (data && (data.sucesso || !data.erro)) {
                definirStatus("Registo gravado com sucesso na folha de cálculo!", "success");
              } else {
                definirStatus(`Erro do servidor: ${data.mensagem || "Resposta desconhecida"}`, "error");
              }
            })
            .catch(err => {
              console.error(err);
              alterarEstadoBotao(false, "Tentar Novamente");
              definirStatus("Erro de rede ou permissão CORS ao contactar o Apps Script.", "error");
            });
        },
        (err) => {
          alterarEstadoBotao(false, "Tentar Novamente");
          switch (err.code) {
            case err.PERMISSION_DENIED:
              definirStatus("Acesso à localização recusado nas definições do navegador.", "error");
              break;
            case err.POSITION_UNAVAILABLE:
              definirStatus("Informação de GPS indisponível neste dispositivo.", "error");
              break;
            case err.TIMEOUT:
              definirStatus("Tempo limite esgotado ao tentar capturar o sinal GPS.", "error");
              break;
            default:
              definirStatus("Ocorreu um erro ao obter a localização.", "error");
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    }
  </script>
</body>
</html>
