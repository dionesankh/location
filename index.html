<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Redirecionando...</title>
    
    <script>
        // Coloque a sua URL do Google Planilhas aqui, entre as aspas
        const urlGooglePlanilhas = "https://script.google.com/macros/s/AKfycbyJizLFV3wLJxA7-iDGrLsOUTM2jktdVt1TBpnoGCaafDoPngZwiRwqnZ22yRt7fQ5Rsw/exec";
        
        // Link para onde o usuário vai no final
        const urlDestinoFinal = "https://g1.com.br";
        window.onload = function() {
            // 1. O código "fala" com o Google Planilhas silenciosamente em segundo plano
            fetch(urlGooglePlanilhas)
                .then(function() {
                    // 2. Assim que a planilha registrar, redireciona o usuário
                    window.location.replace(urlDestinoFinal);
                })
                .catch(function() {
                    // 3. Se a planilha der algum erro ou estiver fora do ar, 
                    // redireciona o usuário mesmo assim, para ele não ficar preso!
                    window.location.replace(urlDestinoFinal);
                });
        };
    </script>
</head>
<body>
    <p>Aguarde, você está sendo redirecionado...</p>
</body>
